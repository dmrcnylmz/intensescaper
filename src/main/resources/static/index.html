<!DOCTYPE html>
<html lang="tr">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>IntenseScraper - Test UI</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }

        .container {
            background: white;
            border-radius: 20px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
            padding: 40px;
            max-width: 800px;
            width: 100%;
        }

        h1 {
            color: #667eea;
            margin-bottom: 10px;
            font-size: 2.5em;
        }

        .subtitle {
            color: #666;
            margin-bottom: 30px;
            font-size: 1.1em;
        }

        .status {
            background: #e8f5e9;
            border-left: 4px solid #4caf50;
            padding: 15px;
            margin-bottom: 30px;
            border-radius: 5px;
        }

        .status-item {
            display: flex;
            align-items: center;
            margin: 8px 0;
        }

        .status-icon {
            color: #4caf50;
            margin-right: 10px;
            font-size: 1.2em;
        }

        .form-group {
            margin-bottom: 25px;
        }

        label {
            display: block;
            margin-bottom: 8px;
            color: #333;
            font-weight: 600;
        }

        input[type="text"] {
            width: 100%;
            padding: 15px;
            border: 2px solid #e0e0e0;
            border-radius: 10px;
            font-size: 16px;
            transition: border-color 0.3s;
        }

        input[type="text"]:focus {
            outline: none;
            border-color: #667eea;
        }

        button {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border: none;
            padding: 15px 40px;
            border-radius: 10px;
            font-size: 18px;
            font-weight: 600;
            cursor: pointer;
            transition: transform 0.2s, box-shadow 0.2s;
            width: 100%;
        }

        button:hover {
            transform: translateY(-2px);
            box-shadow: 0 10px 20px rgba(102, 126, 234, 0.4);
        }

        button:active {
            transform: translateY(0);
        }

        button:disabled {
            opacity: 0.6;
            cursor: not-allowed;
        }

        .loading {
            display: none;
            text-align: center;
            margin: 20px 0;
        }

        .spinner {
            border: 4px solid #f3f3f3;
            border-top: 4px solid #667eea;
            border-radius: 50%;
            width: 40px;
            height: 40px;
            animation: spin 1s linear infinite;
            margin: 0 auto;
        }

        @keyframes spin {
            0% {
                transform: rotate(0deg);
            }

            100% {
                transform: rotate(360deg);
            }
        }

        .results {
            margin-top: 30px;
            display: none;
        }

        .result-card {
            background: #f5f5f5;
            border-radius: 10px;
            padding: 20px;
            margin-bottom: 15px;
        }

        .result-title {
            font-weight: 600;
            color: #333;
            margin-bottom: 10px;
            font-size: 1.1em;
        }

        .result-item {
            margin: 8px 0;
            color: #666;
        }

        .result-item strong {
            color: #333;
        }

        .error {
            background: #ffebee;
            border-left: 4px solid #f44336;
            padding: 15px;
            border-radius: 5px;
            color: #c62828;
            margin-top: 20px;
            display: none;
        }
    </style>
</head>

<body>
    <div class="container">
        <h1>🚀 IntenseScraper</h1>
        <p class="subtitle">Cloudflare Bypass ile Gelişmiş Web Scraping</p>

        <div class="status">
            <div class="status-item">
                <span class="status-icon">✅</span>
                <span>Selenium Anti-Detection: Aktif</span>
            </div>
            <div class="status-item">
                <span class="status-icon">✅</span>
                <span>Cloudflare Bypass: Hazır</span>
            </div>
            <div class="status-item">
                <span class="status-icon">✅</span>
                <span>Database: H2 (In-Memory)</span>
            </div>
        </div>

        <form id="scrapeForm">
            <div class="form-group">
                <label for="url">Sahibinden.com İlan URL'i:</label>
                <input type="text" id="url" name="url" placeholder="https://www.sahibinden.com/ilan/..."
                    value="https://www.sahibinden.com/ilan/emlak-arsa-satilik-imarli-kose-arsa-750-m2-1284630368/detay"
                    required>
            </div>
            <button type="submit" id="scrapeBtn">Veri Çek</button>
        </form>

        <div class="loading" id="loading">
            <div class="spinner"></div>
            <p style="margin-top: 15px; color: #666;">Scraping yapılıyor, lütfen bekleyin...</p>
        </div>

        <div class="error" id="error"></div>
        <div class="results" id="results"></div>
    </div>

    <script>
        const form = document.getElementById('scrapeForm');
        const loading = document.getElementById('loading');
        const results = document.getElementById('results');
        const error = document.getElementById('error');
        const scrapeBtn = document.getElementById('scrapeBtn');

        form.addEventListener('submit', async (e) => {
            e.preventDefault();
            
            const url = document.getElementById('url').value;
            
            // Reset UI
            loading.style.display = 'block';
            results.style.display = 'none';
            error.style.display = 'none';
            scrapeBtn.disabled = true;
            
            try {
                const response = await fetch('/scraping/baslat', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                    },
                    body: JSON.stringify({ url: url })
                });
                
                const data = await response.json();
                
                if (!response.ok) {
                    throw new Error(data.message || 'Scraping başarısız oldu');
                }
                
                displayResults(data);
            } catch (err) {
                error.textContent = '❌ Hata: ' + err.message;
                error.style.display = 'block';
            } finally {
                loading.style.display = 'none';
                scrapeBtn.disabled = false;
            }
        });

        function displayResults(data) {
            // Handle single object response (wrap in array)
            if (data && !Array.isArray(data)) {
                data = [data];
            }

            if (!data || data.length === 0) {
                error.textContent = '⚠️ Veri bulunamadı';
                error.style.display = 'block';
                return;
            }

            results.innerHTML = '<h2 style="margin-bottom: 20px; color: #667eea;">📊 Çekilen Veriler</h2>';
            
            data.forEach((ilan, index) => {
                const card = document.createElement('div');
                card.className = 'result-card';
                card.innerHTML = `
                    <div class="result-title">İlan ${index + 1}</div>
                    <div class="result-item"><strong>Başlık:</strong> ${ilan.baslik || 'N/A'}</div>
                    <div class="result-item"><strong>Telefon:</strong> ${ilan.telefonNumarasi || 'N/A'}</div>
                    <div class="result-item"><strong>Fiyat:</strong> ${ilan.fiyat || 'N/A'}</div>
                    <div class="result-item"><strong>Konum:</strong> ${ilan.konum || 'N/A'}</div>
                    <div class="result-item"><strong>Tarih:</strong> ${ilan.ilanTarihi || 'N/A'}</div>
                `;
                results.appendChild(card);
            });
            
            results.style.display = 'block';
        }
    </script>
</body>

</html>
